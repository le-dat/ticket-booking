_format_version: "3.0"
_transform: true

services:
  # 1. Auth Service (NestJS - Port 3001)
  - name: auth-service
    url: http://auth-service:3001
    routes:
      - name: auth-routes
        paths:
          - /api/v1/auth
        strip_path: false

  # 2. Event & Seat Map Service (Go - Port 3002)
  - name: event-service
    url: http://event-service:3002
    routes:
      - name: event-routes
        paths:
          - /api/v1/events
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  # 3. Booking & Hold Engine Service (Go - Port 3003)
  - name: booking-service
    url: http://booking-service:3003
    routes:
      - name: booking-routes
        paths:
          - /api/v1/bookings
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 10000
          policy: local

  # 4. Payment Service (FastAPI - Port 3004)
  - name: payment-service
    url: http://payment-service:3004
    routes:
      - name: payment-routes
        paths:
          - /api/v1/payments
        strip_path: false

  # 5. Notification & WebSocket Gateway (NestJS - Port 3005)
  - name: notification-service
    url: http://notification-service:3005
    routes:
      - name: notification-routes
        paths:
          - /api/v1/notifications
          - /socket.io
        protocols:
          - http
          - https
        strip_path: false

plugins:
  # Gắn mã truy vết X-Request-ID (Correlation-ID) cho mọi luồng gọi qua Gateway
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
