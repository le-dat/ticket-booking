[project]
name = "auth-service"
version = "0.1.0"
description = "Authentication and RBAC service for Ticket Booking System"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.0.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "redis>=5.0.0",
]
